# Local development infrastructure for TAXPILOT AI.
#   docker compose up -d                      -> PostgreSQL only (default; documents stored on local disk, encrypted)
#   docker compose --profile s3 up -d         -> + MinIO (S3-compatible storage)
#   docker compose --profile scan up -d       -> + ClamAV malware scanner (first start downloads signatures, takes minutes)
name: taxpilot

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-taxpilot}
      POSTGRES_USER: ${DB_USER:-taxpilot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-taxpilot_dev_only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-taxpilot} -d ${DB_NAME:-taxpilot}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    profiles: ["s3"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-taxpilot}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-taxpilot_dev_only}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

  clamav:
    profiles: ["scan"]
    image: clamav/clamav:1.4
    ports:
      - "127.0.0.1:3310:3310"

volumes:
  pgdata:
  miniodata:
